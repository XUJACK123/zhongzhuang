# STM32H723VG: single Cortex-M7 core, single Flash bank.
source [find interface/stlink.cfg]
transport select hla_swd
set CHIPNAME stm32h723
set DUAL_CORE 0
set DUAL_BANK 0
source [find target/stm32h7x.cfg]
# Use a software reset; NRST is optional for this default configuration.
reset_config none
# Conservative SWD clock for reliable ST-Link connection.
adapter speed 100
