# STM32H723VG: single Cortex-M7 core, single Flash bank.
source [find interface/cmsis-dap.cfg]
# Auto-select CMSIS-DAP v1 (HID) or v2 (USB bulk); do not force a backend.
transport select swd
set CHIPNAME stm32h723
set DUAL_CORE 0
set DUAL_BANK 0
source [find target/stm32h7x.cfg]
# Use a software reset; NRST is optional for this default configuration.
reset_config none
# Start conservatively at 1 MHz for DAP probes and jumper-wire connections.
adapter speed 1000
