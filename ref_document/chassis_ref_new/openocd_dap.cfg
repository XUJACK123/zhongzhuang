# Current USB probe: Horco CMSIS-DAP v2 (WinUSB), SWD, STM32H723VG.
# Conservative clock; do not assert NRST automatically during read-only attach.
source [find interface/cmsis-dap.cfg]
cmsis_dap_backend usb_bulk
cmsis_dap_vid_pid 0xfaed 0x4870
cmsis_dap_usb interface 0
transport select swd
set CHIPNAME stm32h723
set DUAL_CORE 0
set DUAL_BANK 0
source [find target/stm32h7x.cfg]
reset_config none
adapter speed 100
