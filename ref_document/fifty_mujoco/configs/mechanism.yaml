# Planar mechanism geometry extracted from the whole-vehicle STEP assembly.
#
# WHAT THIS FILE IS
#   The single place where CAD-derived planar geometry lives, so that
#   `configs/robot.yaml` keeps only model/control parameters and the numbers do
#   not get retyped into code or documents.
#
# WHAT THIS FILE IS NOT
#   It is not a verified mechanism. It contains, in increasing order of
#   confidence:
#     * `cad_extracted`   - a coordinate read out of the STEP text by
#                           `tools/step_audit_standalone.py` (reproducible),
#     * `computed_from_points` - a length derived from those coordinates,
#     * `candidate_inferred`   - a *body assignment* that the geometry supports
#                           but that nobody has confirmed in SolidWorks.
#   Nothing here is `measured`. No entry may be promoted by editing the status
#   alone; a promotion needs a source recorded in
#   `docs/PHYSICAL_PARAMETER_CHECKLIST.md`.
#
# THE ONE THING TO NOT MISREAD
#   `assembly_pose: stowed`. The STEP assembly has the legs folded up, so the
#   hip-to-wheel chord is 300.24 mm while the standing height target is
#   464.75 mm. The coordinates below locate pivots; they are NOT a controller
#   zero and NOT the operating leg length.
meta:
  schema: 1
  generated_at: "2026-10-29"
  plane: "YZ"
  note: "every leg cylinder axis is parallel to X, so the planar coordinates are (Y, Z)"
  units_in_file: mm
  assembly_pose: stowed
  assembly_pose_evidence: >-
    the hip-to-wheel chord is 300.242981 mm while robot.yaml asks for a standing
    height of 464.751 mm; the STEP pose therefore cannot be the deployed pose
  sign_convention: unverified
  rotation_direction: unverified
  status: cad_extracted
  source:
    step_file: "26英雄整车总装2.0.STEP"
    step_bytes: 264168116
    step_sha256: "ffe77c10b183a47c44bb96d829f2a1356c3d644de409979af5ab5da6bd00a055"
    step_header: "AP214, SwSTEP 2.0, mm"
    audit_report: "reports/step_geometry_audit.json"
    audit_command: "python tools/step_audit_standalone.py --step <STEP>"
    document: "docs/STEP_GEOMETRY_AUDIT.md"
  # URDF remains authoritative for frames and axial offsets. A 3D body-origin
  # norm is NOT a planar lever length. Project perpendicular to the hinge axis.
  link_length_authority:
    decision: urdf
    interpretation: perpendicular_to_hinge_axis
    source_urdf: ../../solidwork_graph/fifty_version_training/urdf/fifty_training.urdf
    source: "training URDF joint origins/axes; projection checked by mechanism/resolve.py"
    lengths:
      thigh_m: 0.210000
      shin_m: 0.250000
    axial_offsets_m:
      right: { thigh: 0.0114999999999869, shin: -0.0445999999999935 }
      left: { thigh: 0.0120455339059333, shin: -0.0525499999999913 }
    axial_offset_frame: "signed along the parent hinge local +Z; not base-frame Y"
    adjustment_member: null
    adjustment_reason: "CAD and URDF planar lengths agree; preserve all CAD pins and the 96.600 mm end link"
    withdrawn_interpretation:
      thigh_m: 0.210315
      shin_m: 0.253947
      end_link_mm: 96.242965701
      reason: "3D origin distances included axial offsets and were incorrectly used as planar lengths"

