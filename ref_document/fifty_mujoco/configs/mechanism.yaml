# ---------------------------------------------------------------------------
# Lengths between nodes. `reproduces` names the geometric measurement in
# `docs/STEP_GEOMETRY_AUDIT.md` that the same pair of holes produced, so a typo
# in a coordinate cannot silently change a link length.
link_lengths:
  thigh_hip_to_knee:
    between: [HIP, KNEE]
    length_mm: 210.000000000
    reproduces: G01
    part: 【碳板】18mm-大腿-V2-镜像_默认
    status: cad_extracted
    source: "step_audit measurement G01 (cylinder entities 1002386 and 677239, same part)"
  shin_knee_to_wheel:
    between: [KNEE, WHEEL]
    length_mm: 250.000000000
    reproduces: G02
    part: 【碳板】15mm-小腿_默认
    status: cad_extracted
    source: "step_audit measurement G02"
  push_rod:
    between: [CRANK_PIN, ROD_PIN]
    length_mm: 134.999999999
    reproduces: G03
    part: 【6.8】小腿传动前端连杆_默认
    status: cad_extracted
    source: "step_audit measurement G03"
  end_link:
    between: [END_PIN_A, LINK_PIN_C]
    length_mm: 96.600000000
    reproduces: G04
    part: 【6.8】小腿传动末端连杆_默认
    status: cad_extracted
    source: "step_audit measurement G04"
  ternary_a_b:
    between: [LINK_PIN_A, ROD_PIN]
    length_mm: 135.000000001
    reproduces: G05
    part: 【碳板】8mm-小腿传动中部连杆_默认
    status: cad_extracted
    source: "step_audit measurement G05"
  ternary_a_c:
    between: [LINK_PIN_A, LINK_PIN_C]
    length_mm: 66.999999999
    reproduces: G06
    part: 【碳板】8mm-小腿传动中部连杆_默认
    status: cad_extracted
    source: "step_audit measurement G06"
  ternary_b_c:
    between: [ROD_PIN, LINK_PIN_C]
    length_mm: 200.509609567
    reproduces: G07
    part: 【碳板】8mm-小腿传动中部连杆_默认
    status: cad_extracted
    source: "step_audit measurement G07"

# A rigid body needs a third node to fix its orientation. These lengths were
# never measured as a part feature; they follow from the two node coordinates.
derived_lengths:
  hip_to_crank_pin:
    between: [HIP, CRANK_PIN]
    length_mm: 113.400000000
    status: computed_from_points
    source: "distance between the two bores of 小腿出轴 (38.5 mm and 15.0 mm)"
  hip_to_link_pin_a:
    between: [HIP, LINK_PIN_A]
    length_mm: 113.400000001
    status: computed_from_points
    source: >-
      equal to hip_to_crank_pin to 1e-6 mm. It is recorded, not explained: at
      the assembly pose the ternary link hole A lies on the same circle as the
      crank pin.
  knee_to_link_pin_a:
    between: [KNEE, LINK_PIN_A]
    length_mm: 96.600000000
    status: computed_from_points
    source: "equals the end link length to 1e-6 mm; this is what makes the loop a parallelogram"
  knee_to_end_pin_a:
    between: [KNEE, END_PIN_A]
    length_mm: 66.999999999
    status: computed_from_points
    source: "equals ternary_a_c to 1e-6 mm; the second parallel crank"
  hip_to_end_pin_a:
    between: [HIP, END_PIN_A]
    length_mm: 213.903261302
    status: computed_from_points
    source: "closes the thigh rigid triangle HIP-KNEE-END_PIN_A"
  link_pin_a_to_wheel:
    between: [LINK_PIN_A, WHEEL]
    length_mm: 253.500788873
    status: computed_from_points
    source: "closes the shin rigid triangle KNEE-LINK_PIN_A-WHEEL (used by the link_a_on_shin assignment)"
  end_pin_a_to_wheel:
    between: [END_PIN_A, WHEEL]
    length_mm: 315.242891448
    status: computed_from_points
    source: "closes the shin rigid triangle KNEE-END_PIN_A-WHEEL (used by the link_a_on_thigh assignment)"
  hip_to_wheel_chord:
    between: [HIP, WHEEL]
    length_mm: 300.242981163
    status: computed_from_points
    source: "step_audit mechanism_candidates.hip_to_wheel_chord (assembly pose only)"

# ---------------------------------------------------------------------------
# Rigid-body assignment. EVERY entry is a candidate: the geometry supports it,
# but "which part is bolted to which" needs the SolidWorks mates, which SwSTEP
# does not export.
#
# Parallelogram: the four nodes KNEE, END_PIN_A, LINK_PIN_C, LINK_PIN_A form a
# parallelogram with sides 67.0 / 96.6 / 67.0 / 96.6 (opposite sides equal and
# parallel to 1e-6 mm). That is what the design does, and it is why the ternary
# link angle can be tied to the thigh angle.
bodies:
  ground:
    nodes: [HIP]
    status: cad_extracted
    source: "the hip axis is common to the chassis bracket and both driven sprockets"
  thigh:
    nodes: [HIP, KNEE, LINK_PIN_A]
    status: cad_confirmed
    evidence:
      - "HIP-KNEE is the thigh plate G01"
      - "both thigh plates carry a coaxial Ø35 seat at LINK_PIN_A (step audit §6.8)"
      - "2026-10-30: operator read the assembly mate in SolidWorks - the A pin is fixed on the thigh"
  shin:
    nodes: [KNEE, END_PIN_A, WHEEL]
    status: cad_confirmed
    evidence:
      - "KNEE-WHEEL is the shin plate G02"
      - "the shin plate carries a coaxial Ø24 seat at END_PIN_A and no bore at LINK_PIN_A (step audit §6.8)"
      - "2026-10-30: follows from the A-pin mate read in SolidWorks"
  crank:
    nodes: [HIP, CRANK_PIN]
    status: cad_confirmed
    evidence:
      - "小腿出轴 has a 38.5 mm bore on the hip axis and a 15.0 mm bore at CRANK_PIN"
      - "both DM-8009 sit on 髋关节大铝件, i.e. on the chassis frame, so the crank is turned in the ground frame"
      - "2026-10-31 operator: rotating the thigh swings thigh AND shin (the loop closes); moving the shin alone turns one motor only -> crank angle is ground-referenced"
  push_rod:
    nodes: [CRANK_PIN, ROD_PIN]
    status: cad_extracted
    evidence: ["前推杆 has bores at exactly these two nodes (G03)"]
    confirm_in_cad: "rod end type (spherical or plain) and its free rotation"
  ternary:
    nodes: [ROD_PIN, LINK_PIN_A, LINK_PIN_C]
    status: cad_extracted
    evidence: ["三孔件 G05/G06/G07 close the triangle 135.0 / 67.0 / 200.509609"]
    confirm_in_cad: "none - the A-pin carrier is settled (cad_confirmed on the thigh)"
  end_link:
    nodes: [END_PIN_A, LINK_PIN_C]
    status: cad_extracted
    evidence: ["末端连杆 G04 = 96.6 mm between exactly these nodes"]
    confirm_in_cad: "none for the length"
  wheel:
    nodes: [KNEE, WHEEL]
    status: candidate_inferred
    evidence: ["the wheel axle is carried by the shin plate"]
    confirm_in_cad: "wheel bearing preload and rolling radius (see robot.yaml wheel_radius)"

# ---------------------------------------------------------------------------
# What the mechanism is, and how much of it may be used.
topology:
  # Facts: which parts share a pivot. Computed by the audit, no transform needed.
  shared_datum:
    status: cad_extracted
    report_field: "geometry.shared_axis_nodes"
    tolerance_mm: 0.001
  # The chain itself: 8 nodes, 7 bodies, revolute joints only.
  chain:
    status: confirmed_fixed_link
    dof: 2
    driven_by: [hip motor (thigh vs ground), knee motor (crank about the hip axis)]
    loops: 2
    use_inferred_topology: true
    #: 2026-10-30: confirmed in SolidWorks by the operator - the LINK_PIN_A pin is
    #: fixed on the thigh plate. The STEP audit independently found a coaxial bore
    #: in both thigh plates and none in the shin plate (§6.8), and only this
    #: variant closes the whole +/-0.15 rad grid (961/961 vs 526/961).
    selected_variant: link_a_on_thigh
    selected_variant_evidence:
      cad_mate: "operator read the assembly mate in SolidWorks, 2026-10-30"
      step_geometry: "geometry.pin_carriers: LINK_PIN_A -> thigh plates, END_PIN_A -> shin plate"
      feasible_set: "mechanism-check: link_a_on_thigh closes 961/961 poses, link_a_on_shin 526/961"
    geometry_supports: link_a_on_thigh
    geometry_supports_evidence:
      LINK_PIN_A:
        thigh: ["大腿镜像_默认", "【碳板】18mm-大腿-V2-镜像_默认"]
        shin: []
        corroborating:
          - "【复用交C件】节点轴承座_默认 (r=11.5, 8 coaxial bores at x=158.9)"
          - "【深沟球轴承】F688_默认 (r=8.0)"
          - "【尼龙-机加工】腿限位_默认 (r=17.6)"
      END_PIN_A:
        thigh: []
        shin: ["【碳板】15mm-小腿_默认"]
        corroborating: ["【6.8】小腿传动末端连杆_默认", "轮腿镜像_默认"]
    reason_for_default_off: >-
      superseded on 2026-10-30: the A-pin mate was read in SolidWorks, so the body
      assignment is no longer inferred. Kept for the record - anything built from
      the chain still passes through `topology_gate`, which now lets it through.
    confirm_in_cad:
      - "rotation direction and zero of both motors"
      - "joint stops and the real feasible set (robot.yaml limits are provisional boxes)"
    drive_train:
      status: cad_confirmed
      source: "operator read the mates in SolidWorks, 2026-10-31"
      motors:
        - product: "【电机】DM-8009"
          count: 4
          mounted_on: "【复用交C件】髋关节大铝件 (chassis frame, does not rotate with the leg)"
          drive: "thigh (2) and crank (2), one each per leg"
        - product: "MOTOR_M3508_MKIV_III (with its own reducer)"
          count: 2
          mounted_on: "wheel, directly"
          drive: "wheel"
      chain_drive:
        driving_teeth: 16
        driven_teeth: 19
        ratio: 1.1875
        chain_pitch_mm: 12.7
        status: confirmed
        evidence: "tooth seats counted from geometry; both sprockets imply the same 1/2 in pitch"
      note: >-
        the #NW_GEARBOX_MKIV_III planetary is present in the CAD (14.88:1, carrier
        fixed, ring output) but the operator states the wheel is driven by the
        M3508's own reducer with no gearbox in between, so the MK4 parts are not
        in the wheel power path.
    # Two assignments fit the same eight pivots and the same fourteen lengths.
    # They differ only in which body carries LINK_PIN_A and END_PIN_A, and they
    # are not equivalent: `link_a_on_thigh` closes the whole +/-0.15 rad sweep,
    # `link_a_on_shin` closes 526/961. On 2026-10-30 the A-pin mate was read in
    # SolidWorks -> `link_a_on_thigh` is the real one, so it is now the selection.
    variants:
      - name: link_a_on_shin
        bodies:
          thigh: [HIP, KNEE, END_PIN_A]
          shin: [KNEE, LINK_PIN_A, WHEEL]
          crank: [HIP, CRANK_PIN]
          push_rod: [CRANK_PIN, ROD_PIN]
          ternary: [ROD_PIN, LINK_PIN_A, LINK_PIN_C]
          end_link: [END_PIN_A, LINK_PIN_C]
        note: >-
          three-hole link pivots on the shin, so the parallelogram slaves the
          ternary angle to the thigh angle and the end link is redundant
      - name: link_a_on_thigh
        bodies:
          thigh: [HIP, KNEE, LINK_PIN_A]
          shin: [KNEE, END_PIN_A, WHEEL]
          crank: [HIP, CRANK_PIN]
          push_rod: [CRANK_PIN, ROD_PIN]
          ternary: [ROD_PIN, LINK_PIN_A, LINK_PIN_C]
          end_link: [END_PIN_A, LINK_PIN_C]
        note: >-
          three-hole link pivots on the thigh, so the chain is
          crank -> push rod -> ternary -> end link -> shin pin
  gas_spring:
    status: confirmed_endpoints_approximate_specification
    pin_axis_offset_mm: 11.0
    distance_metric: spatial_pin_center_distance
    endpoints:
      upper: { body: thigh, part: "【复用交C件】上部弹簧套_默认", point_yz_mm: [26.521227636, -24.158015360] }
      lower: { body: shin, part: "【复用交C件】下部弹簧套_默认", point_yz_mm: [-120.869023913, 102.965816698] }
    evidence:
      - "operator: upper seat on the thigh plate, lower on the shin plate, 2026-10-31"
      - "cylinder scan: the upper pin is coaxial with both thigh plates and no shin plate"
      - "cylinder scan: the lower pin is coaxial with the shin plate and no thigh plate"
    pin_distance_at_assembly_mm: 194.9496
    # 2026-10-31: the two clevis pins are parallel to X but sit 11.000 mm apart
    # along it (step_audit drive_train.gas_spring.pin_to_pin.perpendicular_mm),
    # so the physical pin-centre distance is sqrt(planar^2 + 11^2) and the stroke
    # must be judged on that number, not on the YZ projection.
    pin_axis_offset_mm: 11.000
    integration_pending: >-
      endpoints are confirmed; use the accepted approximate 250 mm free length,
      75 mm stroke and 450 N nominal force. Geometry is now spatial (11 mm axial
      separation). The old runtime still uses reference_300n anchors and forces;
      real-spring integration belongs to the future closed-chain model.
  free_ends:
    - node: LINK_PIN_A
      status: cad_confirmed
      note: >-
        third hole of the ternary link. 2026-10-30: a full-cylinder scan found the
        pin coaxial with both thigh plates, a node bearing block, an F688 bearing
        and the nylon leg limit stop, and the operator read the mate in SolidWorks
        (link fixed on the thigh) - see topology.chain.geometry_supports_evidence.
    - node: END_PIN_A
      status: cad_confirmed
      note: >-
        second hole of the end link. 2026-10-30: coaxial with the shin plate only,
        no thigh bore - consistent with link_a_on_thigh.

# ---------------------------------------------------------------------------
# Known-unknowns, kept next to the geometry so nobody has to rediscover them.
unknowns:
  gas_spring_pin_distance:
    status: resolved
    note: >-
      194.9496 mm pin to pin at the assembly pose, from the two 弹簧套 bores; the
      endpoints are confirmed (upper on the thigh plate, lower on the shin plate).
      Specification precision, force curve and runtime integration remain open.
  joint_zeros:
    status: pending
    note: "robot.yaml default_angles are an asset convention, not an encoder zero"
  joint_directions:
    status: pending
    note: "simulation directions are defined in joint_conventions.yaml; hardware wiring/encoder directions remain deployment work"
  feasible_range:
    status: pending
    note: "robot.yaml limits are provisional boxes around the assembly pose, not the closed-chain feasible set"
  mass_and_inertia:
    status: adopted_by_user
    note: "use existing source masses/inertias; preserve grouping and transforms during future model integration"
  spring_stroke_and_force_curve:
    status: approximate_specification_accepted
    note: >-
      450 N nominal, approximately 250 mm free length, 75 mm stroke are adopted.
      A constant 450 N baseline is permitted for the first new-model run when
      explicitly labelled approximate. A measured force curve is a later refinement,
      not a prerequisite for this offline numerical correction.
