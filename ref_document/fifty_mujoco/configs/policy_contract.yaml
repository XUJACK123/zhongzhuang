# Frozen policy interface contract (doc sections 5.1-5.5, 12.7).
#
# The actor, the history buffer, the critic layout and the ONNX exporter must
# all read these numbers from here.  Do not infer channel order from the XML.
contract_version: 2.0.0

orders:
  model_joint_order:
    - rf0_Joint
    - rf1_Joint
    - r_wheel_Joint
    - lf0_Joint
    - lf1_Joint
    - l_wheel_Joint
  # Teacher channel order is UNVERIFIED.  Keep it explicit and empty until the
  # ONNX reproduction gate proves it; never silently reuse the model order.
  teacher_channel_order: null
  teacher_contract_status: unverified
  signs:
    rf0_Joint: 1.0
    rf1_Joint: 1.0
    r_wheel_Joint: 1.0
    lf0_Joint: -1.0
    lf1_Joint: -1.0
    l_wheel_Joint: 1.0

dimensions:
  actor_obs: 25
  history_length: 5
  actor_history: 125
  actions: 6
  base_privileged: 141
  spring_privileged: 8
  privileged_obs: 149
  encoder_latent: 3
  critic_input: 152
  note: "141/144 are legacy comparison sizes only; 149/152 is the 2.0 default."

actor_observation:
  quaternion_order: wxyz
  projected_gravity_body: true
  # [ang_vel(3), projected_gravity(3), command(3), leg_pos(4), joint_vel(6), last_action(6)]
  scales:
    ang_vel: 0.25
    projected_gravity: 1.0
    command: [3.0, 0.25, 5.0]
    leg_position: 1.0
    joint_velocity: 0.05
    last_action: 1.0
  history_layout: "[o(t-4), o(t-3), o(t-2), o(t-1), o(t)]"
  history_update_period_s: 0.01
  # Verified against the Fudan training source
  # (plane/wheel_legged_gym/envs/base/legged_robot.py::compute_proprioception_
  # observations), which builds exactly
  #   [ang_vel*0.25, projected_gravity, commands[:3]*commands_scale,
  #    (dof_pos[[0,1,3,4]] - default[[0,1,3,4]])*1.0, dof_vel*0.05, actions]
  # = 25 channels, in this exact order.  Caveat finally closed.
  channel_order_verified: true
  channel_order_source: "fudan plane legged_robot.compute_proprioception_observations"

actions:
  order: [rf0_Joint, rf1_Joint, r_wheel_Joint, lf0_Joint, lf1_Joint, l_wheel_Joint]
  leg_position_scale: 0.5
  wheel_velocity_scale: 10.0
  clip: 100.0

control:
  policy_dt_s: 0.01
  physics_dt_s: 0.005
  decimation: 2
  target_robot:
    leg_kp_nm_per_rad: 20.0
    leg_kd_nm_s_per_rad: 1.0
    wheel_kp_nm_per_rad: 0.0
    wheel_kd_nm_s_per_rad: 0.2
    torque_limit_nm: 30.0
    compensation_mode: "off"
  teacher_reproduction:
    leg_kp_nm_per_rad: 15.0
    leg_kd_nm_s_per_rad: 1.0
    wheel_kp_nm_per_rad: 0.0
    wheel_kd_nm_s_per_rad: 0.1
    forward_velocity_scale: 3.0
    note: "historical teacher config; must not overwrite the target baseline"

teacher:
  # The Fudan ONNX can be restored bit-exactly, but it is NOT a teacher for this
  # chassis.  Evidence (see reports/teacher_eval.json and
  # docs/MIGRATION_STATUS.md):
  #  * actor/yuntai was trained for infantry_V4: 20.68 kg, leg 0.494 m,
  #    effort 50 N.m, default_dof_pos [0.2, 0.4, 0, -0.2, -0.4, 0].
  #  * this model: 23.26 kg, leg 0.460 m, effort 30 N.m, default angles
  #    [2.055, -2.559, 0, -2.055, 2.559, 0] -> different joint-zero convention,
  #    so the action semantics q* = default + 0.5 a are different.
  #  * Fudan DOF order is left-first, this project is right-first; permuting the
  #    channels was tested and did not help (0.24 s vs 0.49 s survival).
  distillation_enabled: false
  onnx_path: "ref_document/fudan_rl_wheel_leg-main/mujoco/actor/yuntai/上台阶3_angz+.onnx"
  restored_exactly: true
  transfers_to_target: false

critic_extra:
  spring_feature_order: [length, length_velocity, reference_force, actual_force]
  per_spring: 8
  order: [gas_right, gas_left]
  scales:
    length: 5.0
    length_velocity: 1.0
    reference_force: 0.0033333333333333335
    actual_force: 0.0033333333333333335
  note: "1/300 is a numerical normaliser only; it does not imply 300 N is calibrated"

forbidden:
  - "indexing qpos[7:] or qvel[6:] as a generic interface"
  - "treating actuator count as policy action count"
  - "training the encoder with the teacher loss"
  - "feeding gas-spring ground truth to the deployed actor"
