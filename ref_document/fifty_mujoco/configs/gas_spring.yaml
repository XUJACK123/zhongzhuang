    delta_at_assembly_deg: 99.015764
    pin_at_assembly_mm: 194.949622
    planar_pin_at_assembly_mm: 194.639038
    pin_axis_offset_mm: 11.0
    pin_min_mm: 152.152021
    delta_at_min_pin_deg: 175.258206
    pin_max_mm: 249.126126
    pin_at_folded_limit_mm: 152.371079
    pin_travel_mm: 96.974105
    chord_min_mm: 40.000000
    chord_max_mm: 460.000000
    note: "pin spacing has an interior minimum near 175.26 degrees; the 180-degree distance is not the minimum"
  window_as_stated:
    distance_metric: spatial_pin_center_distance
    free_length_mm: 250.0
    stroke_mm: 75.0
    min_chord_mm: 221.189651
    max_chord_mm: 460.000000
    min_height_m: 0.281189651
    max_height_m: 0.520000000
