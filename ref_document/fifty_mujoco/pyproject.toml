[build-system]
requires = ["uv_build>=0.9.0,<0.13"]
build-backend = "uv_build"

[project]
name = "fifty-mujoco"
version = "0.1.0"
description = "MuJoCo migration of the fifty wheel-legged robot (P0-P2: assets, MJCF, CPU spawn audit)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26",
    "mujoco>=3.3.0",
    "PyYAML>=6.0",
    "pillow>=10.0",
    "onnx>=1.16",
]

[project.optional-dependencies]
# GPU stack is installed separately and must never block the CPU model gates.
# See docs/MIGRATION_STATUS.md and `python -m fifty_mujoco.cli doctor`.
gpu = [
    "torch>=2.7",
    "mjlab==1.3.0",
    "warp-lang==1.12.0",
    "onnxruntime>=1.20",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
fifty-mujoco = "fifty_mujoco.cli:main"

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# This machine has ROS 2 humble on PYTHONPATH; its pytest11 plugins fail to
# import inside this project's venv (missing lark / unknown hooks). Blocking
# them by name is harmless on machines where they are absent. Alternatively
# run with PYTEST_DISABLE_PLUGIN_AUTOLOAD=1.
addopts = "-q -p no:launch_testing -p no:launch_ros -p no:ament_flake8 -p no:ament_lint -p no:ament_pep257"
